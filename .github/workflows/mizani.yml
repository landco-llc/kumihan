name: KUMIHAN Mizani v0.1.0 build and release
on:
  push:
    branches: [main, feat/kumihan-mizani-v0.1.0]
    paths:
      - 'plugins/kumihan-mizani/**'
      - 'tools/build_mizani*.py'
      - 'tests/sw/**'
      - 'assets/mizani-*'
      - 'kumihan-sw*.html'
      - 'docs/install-mizani-*.html'
      - 'tools/base_copy.py'
      - 'tools/build_gateways.py'
      - '.github/workflows/mizani.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/kumihan-mizani/**'
      - 'tools/build_mizani*.py'
      - 'tests/sw/**'
      - 'assets/mizani-*'
      - 'kumihan-sw*.html'
      - 'docs/install-mizani-*.html'
      - 'tools/base_copy.py'
      - 'tools/build_gateways.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build completed skills and versioned ZIP archives before site
        run: |
          python tools/build_mizani.py
          python tools/base_copy.py
          python tools/build_mizani_site.py
          python tools/build_gateways.py
      - name: Light acceptance, deterministic sites and package hashes
        run: |
          python -m unittest discover -s tests/sw -v
          python tools/build_mizani_site.py --check
          python tools/build_gateways.py --check
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path('plugins/kumihan-mizani/downloads')
          m=json.loads((root/'MANIFEST.json').read_text())
          assert len(m['packages'])==15
          for item in m['packages']:
              file=root/item['name']
              assert file.name.endswith('-v0.1.0.zip')
              assert hashlib.sha256(file.read_bytes()).hexdigest()==item['sha256']
              with zipfile.ZipFile(file) as z: assert z.testzip() is None
          PY
      - name: Commit rendered site only after completed skill checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/kumihan-mizani-v0.1.0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mizani-site-copy.json assets/mizani-site.css kumihan-sw*.html docs/install-mizani-*.html index.html top-*.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(mizani): render three languages and canonical installation guides'
            git push origin HEAD:feat/kumihan-mizani-v0.1.0
          fi
      - name: Publish GitHub v0.1.0 release (not provider marketplace)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/base_copy.py --check
          python tools/build_mizani_site.py --check
          python tools/build_gateways.py --check
          TAG='kumihan-sw-v0.1.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          gh release create "$TAG" plugins/kumihan-mizani/downloads/*.zip plugins/kumihan-mizani/downloads/MANIFEST.json plugins/kumihan-mizani/downloads/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'KUMIHAN｜Mizani v0.1.0' --notes-file plugins/kumihan-mizani/RELEASE_NOTES.md --latest=false
          gh release view "$TAG" --json isDraft,tagName,url
