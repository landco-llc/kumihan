name: Ziheng static and distribution checks
on:
  pull_request:
    paths:
      - 'plugins/kumihan-ziheng/**'
      - 'tests/ziheng/**'
      - 'kumihan-zh-han*.html'
      - 'docs/install-ziheng*.html'
      - 'docs/ziheng-routing.md'
      - 'assets/ziheng-site.css'
      - '_layouts/landing.html'
      - 'tools/build_ziheng.py'
      - 'tools/build_ziheng_hosts.py'
      - 'tools/locale_resolver.py'
      - 'skills/kumihan/**'
      - '.claude-plugin/marketplace.json'
      - 'tools/install_frame.py'
      - 'assets/kumihan-install.css'
      - '_layouts/installation.html'
      - 'tests/test_site_layout_parity.py'
      - '.github/workflows/ziheng.yml'
permissions:
  contents: read
jobs:
  ziheng:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python -m unittest discover -s tests/ziheng -v
      - run: python tools/build_ziheng.py --check
      - run: python tools/build_ziheng_hosts.py --check
      - run: python tools/build_dist.py --check
      - run: python tools/check_ja_type_011_cases.py
