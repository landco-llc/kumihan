name: JA acceptance QA
on:
  pull_request:
    branches: [feat/ja-v020-research-20261020, qa/ja-v020-acceptance-20261020]
permissions:
  contents: read
jobs:
  candidate-and-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/seo -v
      - run: python tools/check_ja_type_011_cases.py
      - run: python tools/build_dist.py --check
      - run: python tools/build_seo.py --check
      - run: python tools/check_seo_preservation.py
      - run: python tools/web_fonts.py --check
      - run: git diff --exit-code && git diff --check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build --destination /tmp/kumihan-qa-site --trace
      - run: python tools/check_seo.py --site-dir /tmp/kumihan-qa-site
      - name: Verify private source directories are excluded
        run: |
          test ! -e /tmp/kumihan-qa-site/tests
          test ! -e /tmp/kumihan-qa-site/templates
          test ! -e /tmp/kumihan-qa-site/tools
          test ! -e /tmp/kumihan-qa-site/docs/development
