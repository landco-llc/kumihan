name: Compasso OSS v0.1.0
on:
  pull_request:
    paths: ['plugins/kumihan-compasso/**','tests/compasso/**','tools/*compasso*','kumihan-pt*.html','docs/install-compasso-*.html','assets/compasso-*','.github/workflows/compasso.yml']
  push:
    branches: [main]
    paths: ['plugins/kumihan-compasso/**','tests/compasso/**','tools/*compasso*','kumihan-pt*.html','docs/install-compasso-*.html','assets/compasso-*','.github/workflows/compasso.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests/compasso -v
      - run: python tools/build_compasso_site.py --check
