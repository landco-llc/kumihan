name: KUMIHAN Szyk v0.1.0
on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/kumihan-szyk/**'
      - 'tools/build_szyk*'
      - 'tests/szyk/**'
      - 'docs/pl/**'
      - 'kumihan-pl*.html'
      - 'docs/install-szyk-*.html'
      - 'assets/szyk-site*'
      - 'tools/build_gateways.py'
      - 'tools/site_footer.py'
      - 'assets/gateway-copy.json'
      - '_data/site_footer.json'
      - 'tools/base_copy.py'
      - 'tools/web_fonts.py'
      - 'assets/kumihan-fonts.css'
      - 'index.html'
      - 'top-*.html'
      - '.github/workflows/szyk.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/kumihan-szyk/**'
      - 'tools/build_szyk*'
      - 'tests/szyk/**'
      - 'docs/pl/**'
      - 'kumihan-pl*.html'
      - 'docs/install-szyk-*.html'
      - 'assets/szyk-site*'
      - 'tools/build_gateways.py'
      - 'tools/site_footer.py'
      - 'assets/gateway-copy.json'
      - '_data/site_footer.json'
      - 'tools/base_copy.py'
      - 'tools/web_fonts.py'
      - 'assets/kumihan-fonts.css'
      - 'index.html'
      - 'top-*.html'
      - '.github/workflows/szyk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-package-and-site:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python -m unittest discover -s tests/szyk -v
      - run: python tools/build_szyk.py --check
      - run: python tools/build_szyk_site.py --check
      - run: python tools/base_copy.py --check
      - run: python tools/build_gateways.py --check
      - run: python -m unittest tests/test_site_layout_parity.py -v
