name: Publish Grafía v0.1.0
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tested merge commit at kumihan-grafia-v0.1.0
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: kumihan-grafia-v0.1.0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify fixed tested source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install jsonschema==4.26.0 PyYAML==6.0.3
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests/grafia -v
          python tools/build_grafia.py --check
          python tools/build_grafia_site.py --check
      - name: Upload immutable assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view kumihan-grafia-v0.1.0 --json isDraft,assets > /tmp/grafia-release.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/grafia-release.json'))
          if not d['isDraft'] or d['assets']:
              raise SystemExit('Requires empty draft; refuse to overwrite immutable assets')
          PY
          gh release upload kumihan-grafia-v0.1.0 plugins/kumihan-grafia/downloads/*.zip plugins/kumihan-grafia/downloads/MANIFEST.json plugins/kumihan-grafia/downloads/SHA256SUMS.txt
          gh api repos/landco-llc/kumihan/releases/tags/kumihan-grafia-v0.1.0 > /tmp/grafia-assets.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          assets=json.load(open('/tmp/grafia-assets.json'))['assets']
          root=Path('plugins/kumihan-grafia/downloads')
          expected={p.name:p for p in root.iterdir() if p.is_file()}
          if len(expected)!=17 or {a['name'] for a in assets}!=set(expected):
              raise SystemExit('Expected exact 17 assets')
          for a in assets:
              p=expected[a['name']]
              if a['size']!=p.stat().st_size or a.get('digest')!='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest():
                  raise SystemExit('Digest/size mismatch: '+a['name'])
          PY
          gh release edit kumihan-grafia-v0.1.0 --draft=false --latest=false
