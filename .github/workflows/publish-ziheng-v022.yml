name: Publish verified ZiHeng v0.2.2
on:
  push:
    branches: [main]
    paths:
      - 'releases/kumihan-ziheng-v0.2.2/REQUEST.json'
      - 'tools/release_ziheng_v022.py'
permissions:
  contents: read
concurrency:
  group: publish-kumihan-ziheng-v0.2.2
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'landco-llc/kumihan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/ziheng -v
      - run: python tools/public_boundary.py
      - run: python tools/check_ja_type_011_cases.py
      - run: python tools/build_dist.py --check
      - run: python tools/build_ziheng.py --check
      - run: python tools/build_ziheng_hosts.py --check
      - run: python tools/build_ziheng_site.py --check
      - run: python tools/build_gateways.py --check
      - run: python tools/web_fonts.py --check
      - run: python tools/release_ziheng_v022.py --check
      - run: git diff --exit-code
  publish:
    needs: verify
    if: github.repository == 'landco-llc/kumihan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify fixed assets then create and publish the new versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release_ziheng_v022.py --publish
