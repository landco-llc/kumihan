name: SEO foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/seo-foundation-20261019]
permissions:
  contents: read
jobs:
  metadata-and-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/seo -v
      - name: Verify all generators without writing
        run: |
          python tools/build_seo.py --check
          git diff --exit-code
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages Jekyll version
        run: bundle exec jekyll build --destination /tmp/kumihan-seo-site --trace
      - name: Audit actual built HTML and committed sitemap
        run: python tools/check_seo.py --site-dir /tmp/kumihan-seo-site
      - name: Verify built fixtures and source templates are not published
        run: |
          test ! -e /tmp/kumihan-seo-site/tests
          test ! -e /tmp/kumihan-seo-site/templates
          test ! -e /tmp/kumihan-seo-site/tools
