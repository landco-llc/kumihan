name: Accord French v0.1.1
on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/kumihan-accord/**'
      - 'tools/*accord*'
      - 'tests/accord/**'
      - 'docs/accord/**'
      - 'kumihan-fr*.html'
      - 'docs/install-accord-*.html'
      - 'assets/accord-site*'
      - 'assets/kumihan-install.css'
      - 'tools/install_frame.py'
      - 'tools/product_site.py'
      - '_layouts/landing.html'
      - 'tests/test_site_layout_parity.py'
      - 'index.html'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/accord.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/kumihan-accord/**'
      - 'tools/*accord*'
      - 'tests/accord/**'
      - 'docs/accord/**'
      - 'kumihan-fr*.html'
      - 'docs/install-accord-*.html'
      - 'assets/accord-site*'
      - 'assets/kumihan-install.css'
      - 'tools/install_frame.py'
      - 'tools/product_site.py'
      - '_layouts/landing.html'
      - 'tests/test_site_layout_parity.py'
      - 'index.html'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/accord.yml'
permissions:
  contents: write
jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/accord -v
      - run: python tools/build_accord_site.py --check
      - run: python -m unittest tests/test_site_layout_parity.py -v
      - run: python tools/build_accord.py --out /tmp/accord-dist
      - run: python tools/check_accord.py /tmp/accord-dist
      - name: Publish public GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view kumihan-fr-v0.1.1 >/dev/null 2>&1; then
            echo "Existing immutable tag; new version required."
            exit 0
          fi
          gh release create kumihan-fr-v0.1.1 \
            /tmp/accord-dist/*.zip \
            /tmp/accord-dist/SHA256SUMS.txt \
            /tmp/accord-dist/MANIFEST.json \
            --title 'KUMIHAN｜Accord v0.1.1' \
            --notes-file plugins/kumihan-accord/RELEASE_NOTES.md \
            --latest=false
