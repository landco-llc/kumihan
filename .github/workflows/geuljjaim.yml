name: Korean product and site
on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/kumihan-geuljjaim/**'
      - 'tools/*geuljjaim*'
      - 'tools/locale_resolver.py'
      - 'tests/geuljjaim*/**'
      - 'kumihan-ko*.html'
      - 'docs/install-ko-*.html'
      - '_layouts/geuljjaim.html'
      - '_data/geuljjaim.yml'
      - 'assets/geuljjaim.*'
      - '.github/workflows/geuljjaim.yml'
  push:
    branches: [feat/ko-geuljjaim-v010-public]
permissions:
  contents: read
jobs:
  korean-product-site:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0 PyYAML==6.0.3 playwright==1.62.0
      - run: python -m unittest discover -s tests/geuljjaim -v
      - run: python -m unittest discover -s tests/geuljjaim_adapter -v
      - run: python -m unittest discover -s tests/geuljjaim_site -v
      - run: python tools/build_geuljjaim.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/ziheng -v
      - run: python tools/build_ziheng.py --check
      - run: python tools/build_dist.py --check
      - run: python tools/check_ja_type_011_cases.py
      - name: Build the actual Jekyll site
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jekyll
          jekyll build --destination /tmp/geuljjaim-serve/kumihan --baseurl /kumihan --disable-disk-cache
      - name: Browser matrix and local links
        run: |
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/geuljjaim-serve >/tmp/site-server.log 2>&1 &
          python tools/check_geuljjaim_site.py --chromium '' --output /tmp/geuljjaim-browser
