name: Publish Arabic v0.1.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: kumihan-ar-v0.1.0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/arabic -v
      - run: python tools/build_ar.py --check
      - name: Upload verified immutable assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9cf78174f7219d7869f291c88789ca95df1aea7d'
          gh release view kumihan-ar-v0.1.0 --json isDraft,assets > /tmp/ar-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/ar-release.json').read_text())
          if not d['isDraft']:
              raise SystemExit('Release already public: refuse to overwrite v0.1.0')
          if d['assets']:
              raise SystemExit('Draft has assets: reconcile instead of overwriting')
          PY
          gh release upload kumihan-ar-v0.1.0 plugins/kumihan-ar/downloads/*.zip plugins/kumihan-ar/downloads/SHA256SUMS.txt plugins/kumihan-ar/downloads/MANIFEST.json
          gh api repos/landco-llc/kumihan/releases/416549782 > /tmp/ar-assets.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          assets=json.loads(Path('/tmp/ar-assets.json').read_text())['assets']
          root=Path('plugins/kumihan-ar/downloads')
          expected={p.name:p for p in root.iterdir() if p.is_file()}
          if {a['name'] for a in assets} != set(expected):
              raise SystemExit('Release asset inventory mismatch')
          for a in assets:
              p=expected[a['name']]
              if a['size'] != p.stat().st_size or a.get('digest') != 'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest():
                  raise SystemExit('Release asset digest/size mismatch: '+a['name'])
          PY
          gh release edit kumihan-ar-v0.1.0 --draft=false --latest=false
