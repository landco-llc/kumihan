name: Candidate integrity
on:
  push:
    branches: [feat/ja-type-011-active-20261017]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-and-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/public_boundary.py
      - run: python tools/check_ja_type_011_cases.py
      - run: python tools/build_dist.py --check
