name: ZiLu product and site
on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/kumihan-zilu/**'
      - 'tools/*zilu*'
      - 'tests/zilu/**'
      - 'kumihan-zh-cn*.html'
      - 'docs/install-zilu-*.html'
      - 'assets/zilu-site.css'
      - '_layouts/landing.html'
      - 'templates/zilu-*'
      - 'assets/zilu-index-ja.css'
      - 'assets/kumihan-install.js'
      - 'top-zh-cn.html'
      - 'tools/install_frame.py'
      - 'assets/kumihan-install.css'
      - '_layouts/installation.html'
      - 'tests/test_site_layout_parity.py'
      - '.github/workflows/zilu.yml'
permissions:
  contents: read
jobs:
  product-site:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt PyYAML==6.0.3 playwright==1.62.0
      - run: python -m unittest discover -s tests/zilu -v
      - run: python tools/build_zilu.py --check
      - run: python tools/build_zilu_site.py --check
      - name: Other-language regression
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/ziheng -v
          python -m unittest discover -s tests/geuljjaim -v
          python -m unittest discover -s tests/thai -v
          python tools/build_dist.py --check
          python tools/build_ziheng.py --check
          python tools/build_ziheng_hosts.py --check
          python tools/build_geuljjaim.py --check
          python tools/build_th.py --check
          python tools/check_ja_type_011_cases.py
      - name: Host manifest validation
        run: |
          npm install --prefix /tmp/zilu-host-tools --ignore-scripts @anthropic-ai/claude-code@2.1.302 @google/gemini-cli@0.64.0
          CLAUDE_CONFIG_DIR=/tmp/zilu-claude /tmp/zilu-host-tools/node_modules/@anthropic-ai/claude-code-linux-x64/claude plugin validate plugins/kumihan-zilu
          GEMINI_CLI_HOME=/tmp/zilu-gemini /tmp/zilu-host-tools/node_modules/.bin/gemini extensions validate plugins/kumihan-zilu
      - name: Build Jekyll site and browser checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jekyll
          JEKYLL_NO_BUNDLER_REQUIRE=true jekyll build --destination /tmp/zilu-serve/kumihan --baseurl /kumihan --disable-disk-cache
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/zilu-serve >/tmp/zilu-server.log 2>&1 &
          python tools/check_zilu_site.py --chromium '' --output /tmp/zilu-browser
