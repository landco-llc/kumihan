name: Thai source and distribution checks
on:
  pull_request:
    paths:
      - 'plugins/kumihan-th/**'
      - 'tools/build_th.py'
      - 'tools/build_th_site.py'
      - 'tools/locale_resolver.py'
      - 'assets/thai-site*'
      - 'tests/thai/**'
      - 'kumihan-th*.html'
      - 'docs/install-kumihan-th-*.html'
      - 'tools/build_th_*_index.py'
      - 'tools/install_frame.py'
      - 'assets/kumihan-install.css'
      - '_layouts/installation.html'
      - 'tests/test_site_layout_parity.py'
      - '.github/workflows/thai.yml'
  push:
    branches: [main, feat/kumihan-th-v010-goal-20261018]
permissions:
  contents: read
jobs:
  thai:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/thai -v
      - run: python tools/build_th.py --check
      - run: python tools/build_th_site.py --check
      - run: node tests/thai/segmenter_probe.mjs
      - run: python tools/build_dist.py --check
      - run: python tools/build_ziheng.py --check
      - run: python tools/check_ja_type_011_cases.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/ziheng -v
