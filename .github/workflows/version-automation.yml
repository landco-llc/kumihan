name: Edition version automation
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: edition-version-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-renderers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_edition_versions.py' -v
      - run: python -m unittest discover -s tests -p 'test_source_zip_links.py' -v
      - run: python tools/build_seo.py --check
      - run: git diff --exit-code
  propose-verified-update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Execute trusted main scripts, never scripts from the triggering release tag.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify all Release manifests and actual ZIP bytes before updating
        run: python tools/sync_edition_versions.py
      - run: python tools/build_seo.py
      - run: python -m unittest discover -s tests -p 'test_edition_versions.py' -v
      - run: python -m unittest discover -s tests -p 'test_source_zip_links.py' -v
      - run: python tools/build_seo.py --check
      - name: Prepare bounded proposal; never push, merge or deploy
        run: |
          mkdir -p /tmp/version-proposal
          git diff --binary > /tmp/version-proposal/edition-versions.patch
          git rev-parse HEAD > /tmp/version-proposal/BASE_SHA.txt
          cp assets/edition-versions.json /tmp/version-proposal/
          if test -s /tmp/version-proposal/edition-versions.patch; then
            echo 'PATCH_ONLY_CONSTRAINED (semi-automatic): verified patch artifact only. Automatic publication is not implemented. Owner must apply through a feature PR, complete required CI/review and merge before legacy main Pages updates.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No version changes; no repository writes performed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: verified-edition-version-proposal
          path: /tmp/version-proposal
          retention-days: 14
