name: Arabic source, packages and site
on:
  pull_request:
    paths:
      - 'plugins/kumihan-ar/**'
      - 'tools/build_ar*'
      - 'tests/arabic/**'
      - 'assets/kumihan-ar.css'
      - 'assets/kumihan-install.css'
      - 'assets/ar-site-copy.json'
      - 'tools/product_site.py'
      - 'tools/install_frame.py'
      - '_layouts/landing.html'
      - 'kumihan-ar*.html'
      - 'docs/install-kumihan-ar-*.html'
      - '_data/ar-release-published'
      - '.github/workflows/arabic.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/kumihan-ar/**'
      - 'tools/build_ar*'
      - 'tests/arabic/**'
      - 'assets/kumihan-ar.css'
      - 'assets/kumihan-install.css'
      - 'assets/ar-site-copy.json'
      - 'tools/product_site.py'
      - 'tools/install_frame.py'
      - '_layouts/landing.html'
      - 'kumihan-ar*.html'
      - 'docs/install-kumihan-ar-*.html'
      - '_data/ar-release-published'
      - '.github/workflows/arabic.yml'
permissions:
  contents: read
jobs:
  arabic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/arabic -v
      - run: python tools/build_ar.py --check
      - run: python tools/build_ar_site.py --check
