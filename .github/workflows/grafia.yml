name: Grafía product and site
on:
  pull_request:
    branches: [main]
    paths: ['plugins/kumihan-grafia/**', 'tools/*grafia*', 'tests/grafia/**', 'kumihan-es*.html', 'docs/install-grafia-*.html', 'assets/grafia-site*', 'tools/base_copy.py', 'tools/product_site.py', 'tools/install_frame.py', 'assets/kumihan-install.*', '_layouts/landing.html', 'tests/test_site_layout_parity.py', '.github/workflows/grafia.yml']
  push:
    branches: [main, feat/grafia-v0.1.0]
    paths: ['plugins/kumihan-grafia/**', 'tools/*grafia*', 'tests/grafia/**', 'kumihan-es*.html', 'docs/install-grafia-*.html', 'assets/grafia-site*', 'tools/base_copy.py', 'tools/product_site.py', 'tools/install_frame.py', 'assets/kumihan-install.*', '_layouts/landing.html', 'tests/test_site_layout_parity.py', '.github/workflows/grafia.yml']
permissions:
  contents: read
jobs:
  product-site:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt PyYAML==6.0.3 playwright==1.62.0
      - run: python -m unittest discover -s tests/grafia -v
      - run: python tools/build_grafia.py --check
      - run: python tools/build_grafia_site.py --check
      - run: python tools/base_copy.py --check
      - run: python -m unittest tests/test_site_layout_parity.py -v
      - run: node tools/grafia_intl_probe.mjs
      - name: Existing language regression
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/ziheng -v
          python -m unittest discover -s tests/zilu -v
          python -m unittest discover -s tests/geuljjaim -v
          python -m unittest discover -s tests/thai -v
          python -m unittest discover -s tests/accord -v
          python tools/build_dist.py --check
          python tools/build_ziheng.py --check
          python tools/build_ziheng_hosts.py --check
          python tools/build_zilu.py --check
          python tools/build_geuljjaim.py --check
          python tools/build_th.py --check
      - name: Site browser measurements
        run: |
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/grafia-serve
          ln -s "$GITHUB_WORKSPACE" /tmp/grafia-serve/kumihan
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/grafia-serve >/tmp/grafia-server.log 2>&1 &
          python tools/check_grafia_site.py --chromium '' --output /tmp/grafia-browser
