    - heading "日本語の デザインを もっと自然に" [level=1]
    - paragraph: AIとつくるWebサイト、記事、報告書、プレゼンテーション。読みやすさも、伝わりやすさも、内容を大切にすることも。KUMIHANは、日本語のための制作・レビュースキル集です。
    - link "使いはじめる":
      - /url: "#install"
    - link "KUMIHANについて":
      - /url: "#concept"
    - text: OPEN SOURCE FOUR SKILLS JAPANESE FIRST
    - img "KUMIHANの正式ロゴ。黒い組版グリッドと赤い横線、KUMIHANの文字。"
    - text: WORDS · SPACE · PURPOSE KUMIHAN / 01
  - region "「見た目をそろえる」より 「伝わる形を考える」":
    - text: 01 / THE IDEA
    - heading "「見た目をそろえる」より 「伝わる形を考える」" [level=2]:
      - text: 「見た目をそろえる」より
      - emphasis: 「伝わる形を考える」
    - paragraph: 目的も読み手も違うのに、同じ構成を繰り返さない。文章の意味や情報の優先順位を踏まえて、文字組み・余白・レイアウトを考える。KUMIHANは、デザインを画一化するためではなく、一つひとつの制作物をよりよくするための指針を提供します。
  - region "伝えるための4つの視点":
    - text: 02 / WHAT MATTERS
    - heading "伝えるための4つの視点" [level=2]
    - paragraph: 制作と見直しに共通する、KUMIHANが大切にする考え方。
    - article:
      - text: 01 / TYPE
      - heading "自然な日本語組版" [level=3]
      - paragraph: 改行・禁則・約物・和欧混植。文字の読みやすさを、実際の文脈から考えます。
    - article:
      - text: 02 / STRUCTURE
      - heading "内容に合う構成" [level=3]
      - paragraph: 伝える順番と情報の重要度を整理し、目的に合ったレイアウトを考えます。
    - article:
      - text: 03 / FIDELITY
      - heading "原稿を大切に" [level=3]
      - paragraph: 名前・価格・数値・原文を勝手に変えず、意味と情報の正確さを守ります。
    - article:
      - text: 04 / REVIEW
      - heading "制作後の見直し" [level=3]
      - paragraph: 完成物の気になる点を、対象を変更せずに確認・整理するための指針です。
  - region "文字を並べるだけでなく 読む体験を組み立てる":
    - paragraph: DESIGNED FOR THE MESSAGE
    - heading "文字を並べるだけでなく 読む体験を組み立てる" [level=2]:
      - text: 文字を並べるだけでなく
      - strong: 読む体験を組み立てる
    - paragraph: KUMIHANは完成デザインを一律に指定しません。使う媒体や条件に合わせて考えるための知識を提供します。
  - region "4つのスキル ひとつの考え方":
