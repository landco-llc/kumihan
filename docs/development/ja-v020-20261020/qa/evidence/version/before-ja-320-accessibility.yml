      - text: スキルを見る
    - link "04 / REVIEW kumihan-review 制作物を変更せず、組版・情報・デザインの見直しを支援。 スキルを見る":
      - /url: https://github.com/landco-llc/kumihan/tree/main/skills/kumihan-review
