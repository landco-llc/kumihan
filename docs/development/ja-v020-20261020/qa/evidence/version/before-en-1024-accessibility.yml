    - heading "Natural Japanese typography, made with AI" [level=1]
    - paragraph: KUMIHAN is a set of open-source AI skills for creating and reviewing Japanese websites, articles, reports, and presentations—with care for readability, layout, and the integrity of your original content.
    - link "Get started":
      - /url: "#install"
    - link "Learn more":
      - /url: "#concept"
    - text: OPEN SOURCE FOUR SKILLS JAPANESE FIRST
    - 'img "Official KUMIHAN logo: a black typographic grid, a red horizontal bar, and the KUMIHAN wordmark."'
    - text: WORDS · SPACE · PURPOSE KUMIHAN / 01
  - region "Not a uniform look— the right form for each message":
    - text: 01 / THE IDEA
    - heading "Not a uniform look— the right form for each message" [level=2]:
      - text: Not a uniform look—
      - emphasis: the right form for each message
    - paragraph: Every brief, audience, and message is different. KUMIHAN helps AI shape typography, spacing, and hierarchy around the meaning and priorities of each piece—rather than applying one template to everything.
  - region "Four things worth getting right":
    - text: 02 / WHAT MATTERS
    - heading "Four things worth getting right" [level=2]
    - paragraph: Practical priorities for creating and reviewing Japanese content.
    - article:
      - text: 01 / TYPE
      - heading "Japanese typography" [level=3]
      - paragraph: Line breaks, kinsoku rules, punctuation, and mixed Japanese–Latin text—judged in context.
    - article:
      - text: 02 / STRUCTURE
      - heading "Purposeful structure" [level=3]
      - paragraph: Shape the layout around the information, its priority, and the reader’s goal.
    - article:
      - text: 03 / FIDELITY
      - heading "Source fidelity" [level=3]
      - paragraph: Names, prices, figures, and original wording stay exactly as supplied.
    - article:
      - text: 04 / REVIEW
      - heading "Read-only review" [level=3]
      - paragraph: Check finished work and organize issues—without touching the files.
  - region "Beyond arranging type Design the reading experience":
    - paragraph: DESIGNED FOR THE MESSAGE
    - heading "Beyond arranging type Design the reading experience" [level=2]:
      - text: Beyond arranging type
      - strong: Design the reading experience
    - paragraph: KUMIHAN doesn't dictate a finished look. It gives AI the knowledge to adapt to each medium and brief.
